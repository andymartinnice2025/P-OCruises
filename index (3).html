<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blank Page with CXone Script</title>
  </head>
  <body>
    <!-- Blank body on purpose -->
    
    <script>
(function (n,u) {
window.CXoneDfo=n,
window[n]=window[n]||function(){(window[n].q=window[n].q||[]).push(arguments)},window[n].u=u,
e=document.createElement("script"),e.type="module",e.src=u+"?"+Math.round(Date.now()/1e3/3600),
document.head.appendChild(e);
})('cxone','https://web-modules-de-uk1.niceincontact.com/loader/1/loader.js');

    cxone('init', '1305'); 
    cxone('guide', 'init');

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    
    const sessionId = getCookie("QuantumMetricSessionID");
    console.log("QuantumMetricSessionID cookie value:", sessionId);
    
    if (sessionId) {
      cxone('chat', 'setCustomerCustomField', 'qmsessionid', sessionId);
      console.log("Custom field set with session ID:", sessionId);
    } else {
      console.warn("QuantumMetricSessionID cookie not found.");
    }
    
    // Find the anchor element with the greeting
    const greetingLink = document.querySelector('a[aria-label^="Hello "]');
    
    // Extract the first name from the aria-label
    let firstName = null;
    if (greetingLink) {
      const match = greetingLink.getAttribute('aria-label').match(/^Hello\s+(.+)$/);
      if (match) {
        firstName = match[1]; // e.g., "Andy"
      }
    }
    
    // Use the extracted name in the cxone function
    if (firstName) {
      cxone('analytics', 'setVisitorVariable', 'firstName', firstName);
      console.log("First Name set:", firstName);
    } else {
      console.warn("First Name not found.");
    }
    
    // Hide pre-survey (incomplete line for merge)
    cxone('guide','hidePreSurvey');
    
    (function waitForQuantum(retries = 10) {
      if (
        typeof QuantumMetricAPI !== 'undefined' &&
        typeof QuantumMetricAPI.getReplay === 'function' &&
        typeof cxone === 'function'
      ) {
        try {
          const sessionurl = QuantumMetricAPI.getReplay(); // returns string directly
          cxone('chat', 'setCustomerCustomField', 'qmsessionurl', sessionurl);
          console.log('CXone field set with session URL:', sessionurl);
        } catch (err) {
          console.error('Error calling QuantumMetricAPI.getReplay():', err);
        }
      } else if (retries > 0) {
        setTimeout(() => waitForQuantum(retries - 1), 500);
      } else {
        console.error('QuantumMetricAPI or cxone function not available.');
      }
    })();
    
    </script>
  </body>
</html>
